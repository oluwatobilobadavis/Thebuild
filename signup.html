<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account - The Build</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --yellow: #f5c518;
      --yellow-soft: #ffe681;
      --ink: #171714;
      --muted: #77756b;
      --paper: #fffdf5;
      --line: #dedbcf;
      --white: #ffffff;
      --green: #285f4c;
      --shadow: 0 18px 45px rgba(36, 31, 5, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(245, 197, 24, 0.24), transparent 34%),
        linear-gradient(180deg, #fffdf5 0%, #fffaf0 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      width: min(1160px, calc(100% - 48px));
      margin: 0 auto;
      padding: 26px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 20px;
      font-weight: 700;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--yellow);
      border: 2px solid var(--ink);
      border-radius: 8px;
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 18px;
      font-weight: 700;
    }

    .back-link {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .back-link:hover {
      color: var(--ink);
    }

    main {
      min-height: calc(100vh - 145px);
      width: min(960px, calc(100% - 48px));
      margin: 0 auto;
      padding: 42px 0 70px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .signup-card {
      width: min(470px, 100%);
      background: var(--white);
      border: 1.5px solid var(--ink);
      border-radius: 13px;
      padding: 38px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--green);
      font-family: "DM Mono", monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--yellow);
      border: 1px solid var(--ink);
    }

    h1 {
      margin-bottom: 9px;
      font-size: clamp(42px, 7vw, 62px);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: #fffef9;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.22);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 76px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      text-transform: uppercase;
    }

    .show-password:hover {
      color: var(--ink);
    }

    .terms {
      margin: 5px 0 21px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .terms a {
      color: var(--green);
      font-weight: 600;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .primary-btn {
      width: 100%;
      min-height: 50px;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      background: var(--yellow);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .primary-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0 20px;
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .google-btn {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
    }

    .google-btn:hover {
      background: #fffaf0;
    }

    .google-icon {
      width: 18px;
      height: 18px;
      display: block;
    }

    .login-text {
      margin-top: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .login-text a {
      color: var(--green);
      font-weight: 700;
    }

    .login-text a:hover {
      text-decoration: underline;
    }

    .message {
      min-height: 20px;
      margin-top: 15px;
      padding: 0;
      text-align: center;
      color: var(--green);
      font-size: 13px;
      line-height: 1.45;
    }

    footer {
      padding: 0 24px 25px;
      text-align: center;
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 10px;
    }

    @media (max-width: 640px) {
      .site-header {
        width: min(100% - 32px, 1160px);
        padding: 20px 0;
      }

      main {
        width: min(100% - 32px, 960px);
        padding-top: 25px;
      }

      .signup-card {
        padding: 28px 22px;
      }
    }
        .brand-logo {
    width: 78px;
    height: 78px;
    object-fit: contain;
    display: block;
}

  </style>
</head>

<body>
  <header class="site-header">
      <a class="brand" href="#">
    <img src="logo.png" alt="The Build Logo" class="brand-logo">
</a>

    <a class="back-link" href="index.html">← Back home</a>
  </header>

  <main>
    <section class="signup-card">
      <div class="eyebrow">
        New account
      </div>

      <h1>Create account.</h1>

      <p class="subtitle">
        Sign up to shorten links, keep your history, and manage everything in one place.
      </p>

      <form id="signupForm">
        <div class="form-group">
          <label for="name">Full name</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="6"
              required
            >
            <button type="button" class="show-password" id="showPassword">
              Show
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>

          <div class="password-wrap">
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="Repeat your password"
              autocomplete="new-password"
              minlength="6"
              required
            >
            <button type="button" class="show-password" id="showConfirmPassword">
              Show
            </button>
          </div>
        </div>

        <p class="terms">
          By creating an account, you agree to our
          <a href="terms.html">Terms</a> and
          <a href="privacy.html">Privacy Policy</a>.
        </p>

        <button class="primary-btn" type="submit">
          Create account →
        </button>

        <div class="divider">or continue with</div>

        <button class="google-btn" type="button" id="googleSignup">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.35 12.27c0-.71-.06-1.4-.18-2.05H12v3.88h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.19z"/>
            <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.34l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.5A9.75 9.75 0 0 0 12 21.75z"/>
            <path fill="#FBBC05" d="M6.54 13.87a5.86 5.86 0 0 1 0-3.74v-2.5H3.3a9.75 9.75 0 0 0 0 8.74l3.24-2.5z"/>
            <path fill="#EA4335" d="M12 6.1c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.16 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.7 5.38l3.24 2.5C7.31 7.82 9.46 6.1 12 6.1z"/>
          </svg>
          Continue with Google
        </button>

        <div class="message" id="message" aria-live="polite"></div>

        <p class="login-text">
          Already have an account?
          <a href="login.html">Log in</a>
        </p>
      </form>
    </section>
  </main>

  <footer>
    THE BUILD — URL SHORTENER
  </footer>

  <script>
    const signupForm = document.getElementById("signupForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const showPassword = document.getElementById("showPassword");
    const showConfirmPassword = document.getElementById("showConfirmPassword");
    const googleSignup = document.getElementById("googleSignup");
    const message = document.getElementById("message");

    function togglePassword(input, button) {
      const isPassword = input.type === "password";
      input.type = isPassword ? "text" : "password";
      button.textContent = isPassword ? "Hide" : "Show";
    }

    showPassword.addEventListener("click", () => {
      togglePassword(passwordInput, showPassword);
    });

    showConfirmPassword.addEventListener("click", () => {
      togglePassword(confirmPasswordInput, showConfirmPassword);
    });

    signupForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (passwordInput.value !== confirmPasswordInput.value) {
        message.textContent = "Passwords do not match.";
        return;
      }

      if (passwordInput.value.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
      }

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();

      message.textContent =
        `Account request ready for ${name} (${email}). Connect this form to your backend authentication endpoint.`;
    });

    googleSignup.addEventListener("click", () => {
      message.textContent = "Google signup needs to be connected to Google OAuth.";
    });
  </script>
</body>
</html>
